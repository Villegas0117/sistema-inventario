services:
  - type: web
    name: sistema-inventario-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m unittest discover -s tests -t . -v
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
